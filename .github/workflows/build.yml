name: Build Native Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          # 1. Locate project folder even if nested
          PROJECT_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR="."; fi
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 2. Fix Windows line-endings and permissions on gradlew
          if [ -f "gradlew" ]; then
            sed -i 's/\r$//' gradlew
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VGM-KeyMaster-Native-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
