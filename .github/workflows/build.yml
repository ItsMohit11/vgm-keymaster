name: Build Native Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Embed HTML App and Compile Native APK
        run: |
          # 1. Locate project root
          PROJECT_DIR=$(find . -name "settings.gradle*" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR="."; fi
          cd "$PROJECT_DIR"

          # 2. Embed the exact HTML app into Android assets
          mkdir -p app/src/main/assets
          HTML_SRC=$(find /home/runner/work -name "vgm_keymaster_vintage.html" -o -name "*vintage*.html" -o -name "vgm_keymaster*.html" | head -n 1)
          if [ -n "$HTML_SRC" ]; then
            echo "Found HTML app at: $HTML_SRC"
            cp "$HTML_SRC" app/src/main/assets/index.html
          fi

          # 3. Create MainActivity that loads the HTML app in native fullscreen
          cat << 'EOF' > app/src/main/java/com/vgmkeymaster/nativeapp/MainActivity.kt
          package com.vgmkeymaster.nativeapp

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.view.View
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  // Automatically grant microphone permissions for Yamaha acoustic piano tracking
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 101)
                  }

                  // Pure fullscreen immersive landscape mode
                  window.decorView.systemUiVisibility = (
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_FULLSCREEN
                  )

                  webView = WebView(this).apply {
                      settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabled = true
                          mediaPlaybackRequiresUserGesture = false
                          allowFileAccess = true
                          allowContentAccess = true
                          cacheMode = WebSettings.LOAD_DEFAULT
                      }
                      webChromeClient = object : WebChromeClient() {
                          override fun onPermissionRequest(request: PermissionRequest?) {
                              request?.grant(request.resources)
                          }
                      }
                      loadUrl("file:///android_asset/index.html")
                  }

                  setContentView(webView)
              }

              override fun onBackPressed() {
                  if (::webView.isInitialized && webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

          # 4. Clean configurations
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.VGMKeyMaster" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:windowBackground">#12090D</item>
              </style>
          </resources>
          EOF

          # 5. Compile the standalone APK
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VGM-KeyMaster-Native-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
