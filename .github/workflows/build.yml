name: Build Native Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Package Full HTML App into Native APK
        run: |
          # 1. Locate project folder
          APP_DIR=$(find . -maxdepth 3 -name "app" -type d | head -n 1)
          if [ -n "$APP_DIR" ]; then
            PROJECT_DIR=$(dirname "$APP_DIR")
          else
            PROJECT_DIR="."
          fi
          echo "Building inside: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 2. Delete conflicting old Groovy files
          rm -f build.gradle settings.gradle

          # 3. Write clean root build.gradle.kts
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          # 4. Write clean root settings.gradle.kts
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VGM KeyMaster Native"
          include(":app")
          EOF

          # 5. Write clean gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          # 6. Remove duplicate style file to prevent duplicate resource error
          rm -f app/src/main/res/values/styles.xml

          # 7. Write single clean themes.xml
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.VGMKeyMaster" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionBar">false</item>
                  <item name="android:windowFullscreen">true</item>
                  <item name="android:windowContentOverlay">@null</item>
                  <item name="android:windowBackground">#12090D</item>
              </style>
          </resources>
          EOF

          # 8. Embed the exact HTML file into Android assets
          mkdir -p app/src/main/assets
          HTML_SRC=$(find . -name "*vintage*.html" -o -name "vgm_keymaster*.html" | head -n 1)
          if [ -n "$HTML_SRC" ]; then
            echo "Embedding HTML from: $HTML_SRC"
            cp "$HTML_SRC" app/src/main/assets/index.html
          fi

          # 9. Write MainActivity.kt to load the HTML app in fullscreen
          mkdir -p app/src/main/java/com/vgmkeymaster/nativeapp
          cat << 'EOF' > app/src/main/java/com/vgmkeymaster/nativeapp/MainActivity.kt
          package com.vgmkeymaster.nativeapp

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.view.View
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 101)
                  }

                  window.decorView.systemUiVisibility = (
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      or View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      or View.SYSTEM_UI_FLAG_FULLSCREEN
                  )

                  webView = WebView(this).apply {
                      settings.apply {
                          javaScriptEnabled = true
                          domStorageEnabled = true
                          databaseEnabled = true
                          mediaPlaybackRequiresUserGesture = false
                          allowFileAccess = true
                          allowContentAccess = true
                          cacheMode = WebSettings.LOAD_DEFAULT
                      }
                      webChromeClient = object : WebChromeClient() {
                          override fun onPermissionRequest(request: PermissionRequest?) {
                              request?.grant(request.resources)
                          }
                      }
                      loadUrl("file:///android_asset/index.html")
                  }

                  setContentView(webView)
              }

              override fun onBackPressed() {
                  if (::webView.isInitialized && webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

          # 10. Write clean app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.vgmkeymaster.nativeapp"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.vgmkeymaster.nativeapp"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
          }
          EOF

          # 11. Build the APK
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VGM-KeyMaster-Native-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
